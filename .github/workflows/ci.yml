name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-examples:
    # Guards the copyable code in this skill (YAML snippets + Databricks notebook
    # sources). No Databricks workspace or credentials needed — parse/compile/lint only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 scripts/check_examples.py
